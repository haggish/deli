# Single source of truth for dependency versions.
# Used by subprojects (libs.* accessors) and by buildSrc (both its own plugin
# classpath and the convention plugins, via VersionCatalogsExtension).
#
# Anything left without a version here is managed by the Spring Boot BOM
# (via the io.spring.dependency-management plugin in deli.spring-service).

[versions]
kotlin                  = "2.4.21"
spring-boot             = "4.1.2"
spring-dependency-mgmt  = "1.1.7"
spring-cloud            = "2025.1.4"
kotlinx-coroutines      = "1.11.0"
kotlinx-serialization   = "1.13.0"

# Database
# Flyway is pinned below the Boot-managed version (12.x) on purpose; upgrade separately.
flyway                  = "10.22.0"
postgresql              = "42.7.14"
r2dbc-postgresql        = "1.1.3.RELEASE"

# Jackson 2.x (Spring Kafka) — explicit, as on master; databind itself comes from Boot's jackson-2-bom
jackson2-module-kotlin  = "2.22.2"
jackson2-jsr310         = "2.21.3"

# JWT
jjwt                    = "0.12.6"

# AWS (MinIO S3 client)
awssdk                  = "2.59.0"

# Jakarta / misc (used by shared modules, which don't get the Boot BOM)
jakarta-validation      = "3.1.1"
jakarta-servlet         = "6.1.0"
slf4j                   = "2.0.17"

# Testing — Kotest 6 and Testcontainers 2 are major upgrades; kept on 5.x / 1.x for now.
kotest                  = "5.9.1"
mockk                   = "1.14.12"
testcontainers          = "1.21.4"

# Build tooling
ktlint                  = "1.8.0"
ktlint-gradle           = "14.2.0"

[libraries]
# ── Kotlin stdlib, coroutines & serialization ─────────────────────────────────
kotlin-stdlib               = { module = "org.jetbrains.kotlin:kotlin-stdlib",                version.ref = "kotlin" }
kotlin-reflect              = { module = "org.jetbrains.kotlin:kotlin-reflect",               version.ref = "kotlin" }
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",     version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactor  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor",  version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core",  version.ref = "kotlinx-serialization" }
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",  version.ref = "kotlinx-serialization" }

# ── BOMs ──────────────────────────────────────────────────────────────────────
spring-boot-bom     = { module = "org.springframework.boot:spring-boot-dependencies",    version.ref = "spring-boot" }
spring-cloud-bom    = { module = "org.springframework.cloud:spring-cloud-dependencies",  version.ref = "spring-cloud" }
awssdk-bom          = { module = "software.amazon.awssdk:bom",                           version.ref = "awssdk" }

# ── Spring (versions from the Boot / Cloud BOMs) ──────────────────────────────
spring-boot-starter-web         = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux     = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-websocket   = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-data-jpa    = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-r2dbc  = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-starter-data-redis  = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-security    = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-actuator    = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation  = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-kafka       = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-test        = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-cloud-gateway-webflux    = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-kafka                    = { module = "org.springframework.kafka:spring-kafka" }
spring-web                      = { module = "org.springframework:spring-web" }
spring-context                  = { module = "org.springframework:spring-context" }
reactor-test                    = { module = "io.projectreactor:reactor-test" }
micrometer-prometheus           = { module = "io.micrometer:micrometer-registry-prometheus" }

# Jackson 2.x — Spring Kafka still uses it internally
jackson2-module-kotlin      = { module = "com.fasterxml.jackson.module:jackson-module-kotlin",      version.ref = "jackson2-module-kotlin" }
jackson2-datatype-jsr310    = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310",  version.ref = "jackson2-jsr310" }

# ── Database ──────────────────────────────────────────────────────────────────
flyway-core          = { module = "org.flywaydb:flyway-core",                  version.ref = "flyway" }
flyway-postgres      = { module = "org.flywaydb:flyway-database-postgresql",   version.ref = "flyway" }
postgresql-driver    = { module = "org.postgresql:postgresql",                 version.ref = "postgresql" }
r2dbc-postgresql     = { module = "org.postgresql:r2dbc-postgresql",           version.ref = "r2dbc-postgresql" }

# ── JWT ───────────────────────────────────────────────────────────────────────
jjwt-api     = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl    = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# ── AWS ───────────────────────────────────────────────────────────────────────
awssdk-s3    = { module = "software.amazon.awssdk:s3" }

# ── Jakarta / logging ─────────────────────────────────────────────────────────
jakarta-validation-api  = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
jakarta-servlet-api     = { module = "jakarta.servlet:jakarta.servlet-api",       version.ref = "jakarta-servlet" }
slf4j-api               = { module = "org.slf4j:slf4j-api",                       version.ref = "slf4j" }

# ── Testing ───────────────────────────────────────────────────────────────────
kotest-runner-junit5    = { module = "io.kotest:kotest-runner-junit5",    version.ref = "kotest" }
kotest-assertions-core  = { module = "io.kotest:kotest-assertions-core",  version.ref = "kotest" }
mockk                   = { module = "io.mockk:mockk",                    version.ref = "mockk" }
testcontainers-core     = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit5   = { module = "org.testcontainers:junit-jupiter",  version.ref = "testcontainers" }
testcontainers-postgres = { module = "org.testcontainers:postgresql",     version.ref = "testcontainers" }
testcontainers-kafka    = { module = "org.testcontainers:kafka",          version.ref = "testcontainers" }
testcontainers-r2dbc    = { module = "org.testcontainers:r2dbc",          version.ref = "testcontainers" }
testcontainers-localstack = { module = "org.testcontainers:localstack",   version.ref = "testcontainers" }

# ── Gradle plugins (on buildSrc's classpath) ──────────────────────────────────
kotlin-gradle-plugin            = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin",           version.ref = "kotlin" }
kotlin-serialization-plugin     = { module = "org.jetbrains.kotlin:kotlin-serialization",           version.ref = "kotlin" }
kotlin-allopen-plugin           = { module = "org.jetbrains.kotlin:kotlin-allopen",                 version.ref = "kotlin" }
kotlin-noarg-plugin             = { module = "org.jetbrains.kotlin:kotlin-noarg",                   version.ref = "kotlin" }
spring-boot-gradle-plugin       = { module = "org.springframework.boot:spring-boot-gradle-plugin",  version.ref = "spring-boot" }
spring-dep-mgmt-plugin          = { module = "io.spring.gradle:dependency-management-plugin",       version.ref = "spring-dependency-mgmt" }
ktlint-gradle-plugin            = { module = "org.jlleitschuh.gradle:ktlint-gradle",                version.ref = "ktlint-gradle" }

